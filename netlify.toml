[build]
  command = "npm install --ignore-scripts && npm run generate && node server/scripts/setWebhook.js && cd client && npm ci && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"
  [build.environment]
    SECRETS_SCAN_OMIT_PATHS = "server/data/*,PORTALS_GUIDE.md,server/controllers/executiveController.js"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/statement-logo.jpeg"]
  external_node_modules = [
    "@prisma/client",
    "firebase-admin",
    "firebase-admin/app",
    "mongoose",
    "telegraf",
    "pdfkit",
    "socket.io",
    "bcryptjs",
    "otplib",
    "qrcode",
    "multer",
    "useragent",
    "request",
    "yamlparser"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
