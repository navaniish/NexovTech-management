[build]
  command = "npm ci && node server/scripts/setWebhook.js && cd client && npm ci && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"
  [build.environment]
    SECRETS_SCAN_OMIT_PATHS = "server/data/*"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
